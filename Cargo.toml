[workspace]
resolver = "2"
members = [
    "backend",
    "cms-ingest",
    "geo-enrich",
    "compliance-probe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/asathiabalan/healthcare-data-rest"

# NOTE: README.md says "edition 2025" — as of this build there is no Rust
# 2025 edition (editions ship 2015/2018/2021/2024, next is expected 2027).
# Pinned to the 2021 edition, which is what 1.85 actually supports and is
# forward compatible with a later `cargo fix --edition` if 2024/2027 lands.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "tls-rustls", "chrono", "migrate", "macros"] }
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
async-trait = "0.1"
futures = "0.3"
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
# Pinned to 8.x (not the latest 9.x) — 9.x's "axum" feature is built
# against axum 0.8, but this workspace is still on axum 0.7 (see the
# `axum` entry above); 8.x's SwaggerUi -> Router<S> impl matches 0.7.
utoipa-swagger-ui = { version = "=8.1.0", features = ["axum"] }

cms-ingest = { path = "cms-ingest" }
geo-enrich = { path = "geo-enrich" }
compliance-probe = { path = "compliance-probe" }
